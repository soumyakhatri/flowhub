services:
  mongodb:
    image: mongo:7
    container_name: flowhub-mongodb
    ports:
      - "27018:27017"
    volumes:
      - flowhub-mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  flowhub-mongo-data: